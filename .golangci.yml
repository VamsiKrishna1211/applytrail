version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - unconvert
    - wastedassign
  settings:
    revive:
      rules:
        - name: exported
          arguments: ["disableStutteringCheck"]
  exclusions:
    rules:
      - path: _test\.go$
        linters:
          - gosec
          - noctx

formatters:
  enable:
    - gofmt
    - goimports
