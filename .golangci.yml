version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - unconvert
    - wastedassign
  settings:
    errcheck:
      # Writing to stdout or a tabwriter has no meaningful failure handling in a
      # CLI: if stdout is broken the process has nothing left to report with.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    revive:
      rules:
        - name: exported
          arguments: ["disableStutteringCheck"]
  exclusions:
    rules:
      - path: _test\.go$
        linters:
          - gosec
          - noctx
          # Test helpers close response bodies via t.Cleanup, which bodyclose
          # cannot see through.
          - bodyclose

formatters:
  enable:
    - gofmt
    - goimports
