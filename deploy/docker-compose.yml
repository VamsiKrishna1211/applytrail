name: applytrail

services:
  postgres:
    image: postgres:17-alpine
    container_name: applytrail-postgres
    environment:
      POSTGRES_USER: applytrail
      POSTGRES_PASSWORD: applytrail
      POSTGRES_DB: applytrail
    ports:
      - "5432:5432"
    volumes:
      - applytrail-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U applytrail -d applytrail"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  applytrail-pgdata:
